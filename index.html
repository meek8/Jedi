
<!DOCTYPE HTML>
<html>
<head>
    <title>Bookie</title>
<link rel="stylesheet" href="site.css" />

    <!-- 1. Load data/logic tools first -->
    <script defer src="api.js"></script>
    <script defer src="state.js"></script>
    <script defer src="ui.js"></script>

    <!-- 2. Load the controller last -->
    <script defer src="main.js"></script>
</head>
<body>
    <div class="App">
      <div class="SearchBox">
        <input
          id="search_input"
          placeholder="Type a book title..."
          value="the lord of the rings"
        />
        <button onclick="onSearch()">Search</button>
      </div>
      <div class="Paginator">
        <button onclick="decrementPage()">&larr;</button>
        <span id="pages_span">&nbsp; / &nbsp;</span>
        <button onclick="incrementPage()">&rarr;</button>
      </div>
      <div class="Books" id="books_div">
      
      


      </div>
    </div>
</body>
</html>
